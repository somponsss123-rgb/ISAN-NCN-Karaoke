
name: Build ISAN Karaoke EMK - Saved Catalog FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-emk-saved-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate original EMK project from existing ZIPs
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0

          while IFS= read -r -d '' ZIP; do
            test "$FOUND" = 0 || break
            unzip -tq "$ZIP" >/dev/null 2>&1 || continue

            DEST="$RUNNER_TEMP/emk-project"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            unzip -q "$ZIP" -d "$DEST"

            while IFS= read -r -d '' CFG; do
              DIR="$(dirname "$CFG")"
              HTML="$DIR/app/src/main/assets/www/index.html"
              JAVA="$DIR/app/src/main/java/com/isan/ncnkaraoke/offline/MainActivity.java"

              test -f "$DIR/package.json" || continue
              test -f "$JAVA" || continue
              test -f "$HTML" || continue
              grep -q 'ISANKaraokeEMK' "$CFG" || continue
              grep -qi '\.emk' "$HTML" || continue

              EXPECTED='02e4958c5dd1'
              ACTUAL="$(sha256sum "$HTML" | cut -c1-12)"

              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
                echo "Selected EMK ZIP: $ZIP"
                FOUND=1
                break
              fi
            done < <(find "$DEST" -type f -name settings.gradle -print0)
          done < <(find . -maxdepth 2 -type f -iname '*emk*.zip' -print0 | sort -z)

          if [ "$FOUND" = 0 ]; then
            echo 'ERROR: Could not find a compatible existing EMK ZIP.'
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

