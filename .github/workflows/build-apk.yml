      - name: Verify patched source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'savedMusicTree()' "$APP_DIR/app/src/main/java/com/isan/ncnkaraoke/offline/MainActivity.java"
          grep -q 'isanRestoreNativeLibrary' "$APP_DIR/app/src/main/assets/www/index.html"
          grep -q 'rescanSavedFolder' "$APP_DIR/app/src/main/assets/www/index.html"
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          h=Path(os.environ['APP_DIR'])/'app/src/main/assets/www/index.html'
          text=h.read_text()
          js=text[text.rfind('<script>')+8:text.rfind('</script>')]
          Path('/tmp/karaoke-catalog-check.js').write_text(js)
          PYCODE

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JavaScript syntax
        run: node --check /tmp/karaoke-catalog-check.js

      - name: Use preinstalled Android SDK and install API 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Package offline audio libraries
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          npm run assets
          test -s app/src/main/assets/www/vendor/libfluidsynth-2.4.6.js
          test -s app/src/main/assets/www/vendor/js-synthesizer.min.js
          test -s app/src/main/assets/www/vendor/jszip.min.js

      - name: Build updated APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$APP_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            release/ISAN-Karaoke-EMK-SAVED-CATALOG.apk

      - name: Upload new APK
        uses: actions/upload-artifact@v4
        with:
          name: ISAN-Karaoke-EMK-SAVED-CATALOG-APK
          path: release/ISAN-Karaoke-EMK-SAVED-CATALOG.apk
          if-no-files-found: error
