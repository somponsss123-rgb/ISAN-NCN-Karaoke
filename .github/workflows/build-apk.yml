
name: Build ISAN Karaoke EMK - Saved Catalog FIX v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-emk-saved-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Find existing EMK ZIP
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          DEST="$RUNNER_TEMP/emk-saved-catalog"
          while IFS= read -r -d '' ZIP; do
            unzip -tq "$ZIP" >/dev/null 2>&1 || continue
            rm -rf "$DEST"
            mkdir -p "$DEST"
            unzip -q "$ZIP" -d "$DEST"
            while IFS= read -r -d '' SETTINGS; do
              DIR="$(dirname "$SETTINGS")"
              HTML="$DIR/app/src/main/assets/www/index.html"
              JAVA="$DIR/app/src/main/java/com/isan/ncnkaraoke/offline/MainActivity.java"
              test -f "$DIR/package.json" || continue
              test -f "$HTML" || continue
              test -f "$JAVA" || continue
              grep -q 'ISANKaraokeEMK' "$SETTINGS" || continue
              grep -qi '\.emk' "$HTML" || continue
              HASH="$(sha256sum "$HTML" | cut -c1-12)"
              if [ "$HASH" = "02e4958c5dd1" ]; then
                echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
                echo "Found compatible EMK ZIP: $ZIP"
                FOUND=1
                break
              fi
            done < <(find "$DEST" -type f -name settings.gradle -print0)
            test "$FOUND" = 0 || break
          done < <(find . -maxdepth 2 -type f -iname '*emk*.zip' -print0 | sort -z)
          if [ "$FOUND" = 0 ]; then
            echo 'ERROR: Cannot find compatible EMK Android ZIP in GitHub repository.'
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

      - name: Install permanent song catalog in source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['APP_DIR'])
          java = root / 'app/src/main/java/com/isan/ncnkaraoke/offline/MainActivity.java'
          html = root / 'app/src/main/assets/www/index.html'
          j = java.read_text(encoding='utf-8')
          h = html.read_text(encoding='utf-8')

          def swap(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise RuntimeError(f'{label}: expected once, found {count}; source changed')
              return text.replace(before, after, 1)

          # Persistent file identifiers
          j = swap(j, 'import java.util.UUID;', 'import android.util.Base64;\nimport java.nio.charset.StandardCharsets;', 'Java imports')
          j = swap(j, 'Uri uri = fileUris.get(path);', '''Uri uri = fileUris.get(path);
                              if (uri == null && path.startsWith("u_")) {
                                  try {
                                      String decoded = new String(Base64.decode(path.substring(2),
                                              Base64.URL_SAFE | Base64.NO_WRAP), StandardCharsets.UTF_8);
                                      Uri candidate = Uri.parse(decoded);
                                      if ("content".equals(candidate.getScheme())) uri = candidate;
                                  } catch (Exception ignored) { return null; }
                              }''', 'persistent proxy')
          j = swap(j, '''        @JavascriptInterface public void clearMusicFolder() {''', '''        @JavascriptInterface public String savedMusicTree() {
                      return preferences.getString(KEY_TREE, "");
                  }
                  @JavascriptInterface public void rescanMusicFolder() {
                      String saved = preferences.getString(KEY_TREE, "");
                      if (!saved.isEmpty()) scanMusic(Uri.parse(saved));
                      else notice("กรุณาเลือกโฟลเดอร์เพลงก่อน");
                  }
                  @JavascriptInterface public void clearMusicFolder() {''', 'Java bridge methods')
          j = swap(j, 'if (!savedTree.isEmpty()) scanMusic(Uri.parse(savedTree));', '''if (!savedTree.isEmpty()) {
                      js("if(window.isanRestoreNativeLibrary)window.isanRestoreNativeLibrary();" +
                         "else window.AndroidNCN.rescanMusicFolder();");
                  }''', 'restore catalog before scanning')
          j = swap(j, 'String id = UUID.randomUUID().toString();', '''String id = "u_" + Base64.encodeToString(uri.toString().getBytes(StandardCharsets.UTF_8),
                          Base64.URL_SAFE | Base64.NO_WRAP | Base64.NO_PADDING);''', 'stable file IDs')

          # Folder selection and catalog controls
          h = swap(h, '<div class="imports"><label class="filebtn">', '''<button id="rescanSavedFolder" type="button" style="width:100%;margin-bottom:9px">🔄 อัปเดตรายการเพลง (เมื่อเพิ่มหรือลบเพลง)</button>
          <div id="nativeSavedStatus" role="status" aria-live="polite">ยังไม่ได้เลือกโฟลเดอร์เพลง</div>
          <div class="imports"><label class="filebtn">''', 'catalog controls')
          h = h.replace('📁 เลือกโฟลเดอร์ (ถ้ารองรับ)', '📁 เลือกโฟลเดอร์เพลงทั้งหมด')
          h = swap(h, 'const {zip=false,skipped=0}=opts;', 'const {zip=false,skipped=0,replace=false}=opts;', 'replace import flag')
          h = swap(h, 'for(const song of state.songs)groups.set(song._groupId||song.key,{...song});', 'for(const song of (replace?[]:state.songs))groups.set(song._groupId||song.key,{...song});', 'replace songs on scan')
          h = swap(h, "$('pickFolder').onclick=async()=>{", '''$('pickFolder').onclick=async()=>{
           if(window.AndroidNCN){
             if(importBusy){toast('กำลังนำเข้าเพลงอยู่');return}
             $('nativeSavedStatus').textContent='กำลังเปิดตัวเลือกโฟลเดอร์ของ Android';
             window.AndroidNCN.chooseMusicFolder();
             return;
           }''', 'Android folder picker')
          h = swap(h, '''if(window.AndroidNCN)window.AndroidNCN.clearMusicFolder();stop();''', '''if(window.AndroidNCN){window.AndroidNCN.clearMusicFolder();eraseNativeLibraryCache().catch(console.warn)}stop();''', 'clear library cache')
          h = swap(h, 'const smf=await song.mid.arrayBuffer();', '''if(!song.emk&&song.lyr&&(!song.lyricLines||!song.lyricLines.length)){
                const d=parseLYR(await song.lyr.arrayBuffer());
                song.lyricLines=d.lines;song.title=d.title||song.title;song.artist=d.artist||song.artist;
              }
              const smf=await song.mid.arrayBuffer();''', 'load lyrics on demand')
          h = swap(h, 'name:item.name,size:Number(item.size||0),ncnPath:item.path||item.name,', 'nativeId:item.id,name:item.name,size:Number(item.size||0),ncnPath:item.path||item.name,', 'remember proxy ID')
          h = swap(h, 'await runImport(async()=>{await addFiles(files)});', '''await runImport(async()=>{
              await addFiles(files,{replace:true});
              try{await saveNativeLibraryCache()}
              catch(err){console.error('cache save failed',err);toast('บันทึกดัชนีเพลงไม่สำเร็จ: '+err.message)}
            });''', 'save after full scan')
          h = swap(h, "  $('nativePickMusic').onclick=()=>window.AndroidNCN.chooseMusicFolder();\n", '', 'remove missing nativePickMusic')
          h = swap(h, "  $('nativePickSF2').onclick=()=>window.AndroidNCN.chooseSF2();\n", '', 'remove missing nativePickSF2')
          h = swap(h, "  $('nativeChooseSFSettings').onclick=()=>window.AndroidNCN.chooseSF2();", '''  $('rescanSavedFolder').onclick=()=>{
              if(importBusy){toast('กำลังนำเข้าเพลงอยู่');return}
              $('nativeSavedStatus').textContent='กำลังอัปเดตดัชนีเพลง';
              window.AndroidNCN.rescanMusicFolder();
            };
            $('nativeChooseSFSettings').onclick=()=>window.AndroidNCN.chooseSF2();''', 'manual rescan button')

          # IndexedDB catalog: save song metadata only
          catalog_js = r'''
          const LIBDB='isan-karaoke-library-index-v1',LIBSTORE='catalog';

          function openLibraryDB(){return new Promise((ok,fail)=>{
            const q=indexedDB.open(LIBDB,1);
            q.onupgradeneeded=()=>q.result.createObjectStore(LIBSTORE);
            q.onsuccess=()=>ok(q.result);q.onerror=()=>fail(q.error);
          })}

          function libraryTxn(db,mode,operation){return new Promise((ok,fail)=>{
            const tx=db.transaction(LIBSTORE,mode),q=operation(tx.objectStore(LIBSTORE));let data;
            q.onsuccess=()=>data=q.result;q.onerror=()=>fail(q.error);
            tx.oncomplete=()=>ok(data);tx.onerror=()=>fail(tx.error);
          })}

          function packFile(f){
            return f?.nativeId?[f.nativeId,f.name,f.ncnPath||f.name,f.size||0]:null
          }

          function unpackFile(f){
            return f?nativeProxyFile({id:f[0],name:f[1],path:f[2],size:f[3]}):null
          }

          async function saveNativeLibraryCache(){
            const tree=window.AndroidNCN?.savedMusicTree?.();
            if(!tree)throw Error('ไม่พบโฟลเดอร์เพลงที่บันทึกไว้');

            const rows=state.songs.map(s=>({
              g:s._groupId||'',k:s.key,t:s.title,a:s.artist||'',
              f:s.format||'',mk:s.musicalKey||'',v:s.vocalChannel||'',
              e:packFile(s.emk),m:packFile(s.mid),
              l:packFile(s.lyr),c:packFile(s.cur)
            }));

            const db=await openLibraryDB();
            try{
              await libraryTxn(db,'readwrite',s=>s.put({schema:1,tree,rows},'current'))
            }finally{
              db.close()
            }

            $('nativeSavedStatus').textContent=`✅ บันทึกดัชนีถาวรแล้ว ${rows.length.toLocaleString('th-TH')} เพลง`;
            reportImport('บันทึกคลังเพลงถาวรแล้ว',100,`พร้อมใช้ ${rows.length.toLocaleString('th-TH')} เพลง`,true);
          }

          async function eraseNativeLibraryCache(){
            const db=await openLibraryDB();
            try{
              await libraryTxn(db,'readwrite',s=>s.delete('current'))
            }finally{
              db.close()
            }
          }

          window.isanRestoreNativeLibrary=async()=>{
            let db;
            try{
              const tree=window.AndroidNCN?.savedMusicTree?.();
              if(!tree)return;

              db=await openLibraryDB();
              const cache=await libraryTxn(db,'readonly',s=>s.get('current'));

              if(!cache||cache.schema!==1||cache.tree!==tree||!cache.rows?.length){
                throw Error('No saved catalog');
              }

              const songs=cache.rows.map(r=>({
                _groupId:r.g||undefined,
                key:r.k,
                title:r.t,
                artist:r.a||'',
                format:r.f||'',
                musicalKey:r.mk||'',
                vocalChannel:r.v||'',
                emk:unpackFile(r.e),
                mid:unpackFile(r.m),
                lyr:unpackFile(r.l),
                cur:unpackFile(r.c),
                lyricLines:[],
                _decoded:false
              })).filter(s=>s.mid||s.emk);

              if(!songs.length)throw Error('Empty catalog');

              state.songs=songs;
              renderSongs();

              $('nativeSavedStatus').textContent=`✅ โหลดคลังที่บันทึกไว้ ${songs.length.toLocaleString('th-TH')} เพลง`;
              $('importStatus').textContent=`พร้อมค้นหาและเล่น ${songs.length.toLocaleString('th-TH')} เพลง โดยไม่ต้องสแกนใหม่`;
              $('importTracker').classList.add('hidden');
              status('พร้อมเล่นจากคลังเพลงที่บันทึกไว้');

            }catch(err){
              console.warn('No valid saved catalog, scanning once:',err);
              $('nativeSavedStatus').textContent='กำลังสแกนโฟลเดอร์และสร้างดัชนีครั้งแรก';
              window.AndroidNCN.rescanMusicFolder();
            }finally{
              db?.close()
            }
          };
          '''

          h = swap(
              h,
              "// ===== Native offline Android bridge; no CDN or network calls =====",
              catalog_js + "\n// ===== Native offline Android bridge; no CDN or network calls =====",
              'install catalog manager'
          )

          java.write_text(j,encoding='utf-8')
          html.write_text(h,encoding='utf-8')

          assert 'UUID.randomUUID' not in j
          assert 'rescanSavedFolder' in h
          assert 'savedMusicTree()' in j
          assert 'isanRestoreNativeLibrary' in h
          assert "$('nativePickMusic')" not in h

          script=h[h.rfind('<script>')+8:h.rfind('</script>')]
          Path('/tmp/emk-saved-catalog-check.js').write_text(script,encoding='utf-8')

          print('SUCCESS: folder importer and permanent song catalog patched.')
          PY

      - name: Check Android source changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'savedMusicTree()' "$APP_DIR/app/src/main/java/com/isan/ncnkaraoke/offline/MainActivity.java"
          grep -q 'isanRestoreNativeLibrary' "$APP_DIR/app/src/main/assets/www/index.html"
          grep -q 'rescanSavedFolder' "$APP_DIR/app/src/main/assets/www/index.html"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript code
        run: node --check /tmp/emk-saved-catalog-check.js

      - name: Setup Android SDK command tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'

      - name: Install Android API 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install offline music libraries
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          npm run assets
          test -s app/src/main/assets/www/vendor/libfluidsynth-2.4.6.js
          test -s app/src/main/assets/www/vendor/js-synthesizer.min.js
          test -s app/src/main/assets/www/vendor/jszip.min.js

      - name: Build EMK APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$APP_DIR/app/build/outputs/apk/debug/app-debug.apk" release/ISAN-Karaoke-EMK-SAVED-CATALOG-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ISAN-Karaoke-EMK-SAVED-CATALOG-v2-APK
          path: release/ISAN-Karaoke-EMK-SAVED-CATALOG-v2.apk
          if-no-files-found: error
