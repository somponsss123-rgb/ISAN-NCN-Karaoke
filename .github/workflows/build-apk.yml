          from pathlib import Path
          html = Path(
              'app/src/main/assets/www/index.html'
          ).read_text(encoding='utf-8')

          Path('/tmp/karaoke-check.js').write_text(
              html[html.rfind('<script>')+8:html.rfind('</script>')]
          )
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript
        run: node --check /tmp/karaoke-check.js

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install offline audio engine
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          npm run assets

          test -s app/src/main/assets/www/vendor/libfluidsynth-2.4.6.js
          test -s app/src/main/assets/www/vendor/js-synthesizer.min.js
          test -s app/src/main/assets/www/vendor/jszip.min.js

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$APP_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            release/ISAN-Karaoke-EMK-SAVED-CATALOG-FIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ISAN-Karaoke-EMK-SAVED-CATALOG-FIX-APK
          path: release/ISAN-Karaoke-EMK-SAVED-CATALOG-FIX.apk
          if-no-files-found: error
