name: Build ISAN NCN Karaoke APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v4

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q ISAN-NCN-Karaoke-Android-Offline-Project.zip

      - name: Install libraries
        working-directory: ISAN-NCN-Android-App-Project
        run: npm install --no-audit --no-fund

      - name: Build APK
        working-directory: ISAN-NCN-Android-App-Project
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ISAN-NCN-Karaoke-APK
          path: ISAN-NCN-Android-App-Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
