
name: Build ISAN Karaoke EMK - Saved Song Catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-emk-cached-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout existing repository
        uses: actions/checkout@v4

      - name: Find existing EMK project ZIP automatically
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          DEST="$RUNNER_TEMP/emk-sources"
          while IFS= read -r -d '' ZIP; do
            echo "Checking existing ZIP: $ZIP"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            if ! unzip -tq "$ZIP" >/dev/null 2>&1; then continue; fi
            unzip -q "$ZIP" -d "$DEST"
            while IFS= read -r -d '' SETTINGS; do
              DIR="$(dirname "$SETTINGS")"
              HTML="$DIR/app/src/main/assets/www/index.html"
              JAVA="$DIR/app/src/main/java/com/isan/ncnkaraoke/offline/MainActivity.java"
              if grep -q 'ISANKaraokeEMK' "$SETTINGS" \
                 && test -f "$DIR/package.json" \
                 && test -f "$HTML" && test -f "$JAVA" \
                 && grep -qi '\.emk' "$HTML"; then
                echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
                echo "EMK project selected from: $ZIP"
                FOUND=1
                break
              fi
            done < <(find "$DEST" -type f -name settings.gradle -print0)
            if [ "$FOUND" -eq 1 ]; then break; fi
          done < <(find . -maxdepth 2 -type f -iname '*emk*.zip' -print0 | sort -zr)
          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: Existing EMK project ZIP not found."
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi

